<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cta-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="0" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="35" r="90" fill="#4facfe" opacity="0.07"/>
  <circle cx="750" cy="180" r="70" fill="#00f2fe" opacity="0.05"/>
  <circle cx="80" cy="190" r="110" fill="#4facfe" opacity="0.04"/>

  <!-- Code brackets -->
  <text x="40" y="125" font-family="monospace" font-size="80" fill="#4facfe" opacity="0.2">&lt;</text>
  <text x="730" y="125" font-family="monospace" font-size="80" fill="#00f2fe" opacity="0.2">/&gt;</text>

  <!-- Name -->
  <text x="400" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">Mads Holst Jensen</text>

  <!-- Accent line -->
  <rect x="250" y="80" width="300" height="3" rx="2" fill="url(#accent-gradient)"/>

  <!-- Services subtitle -->
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94a3b8" text-anchor="middle">WordPress Expert  ·  Custom Web Apps  ·  SaaS Development</text>

  <!-- CTA pill -->
  <rect x="270" y="140" width="260" height="36" rx="18" fill="url(#cta-gradient)"/>
  <text x="400" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">🟢  Available for projects</text>

  <!-- Tagline -->
  <text x="400" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Turning ideas into performant, scalable web solutions since 2019</text>
</svg>
